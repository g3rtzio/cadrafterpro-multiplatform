<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2F7BFF"/>
      <stop offset="1" stop-color="#0A2E7A"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity="0.10" stroke-width="2"/>
    </pattern>
    <clipPath id="clip"><rect x="16" y="16" width="480" height="480" rx="108"/></clipPath>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" fill="url(#grid)" clip-path="url(#clip)"/>
  <!-- area takeoff: an L-shaped floor plan -->
  <path d="M120 128 H312 V232 H392 V368 H120 Z" fill="#34C759" fill-opacity="0.35" stroke="#fff" stroke-width="20" stroke-linejoin="round"/>
  <g fill="#fff">
    <circle cx="120" cy="128" r="18"/><circle cx="312" cy="128" r="18"/><circle cx="312" cy="232" r="18"/>
    <circle cx="392" cy="232" r="18"/><circle cx="392" cy="368" r="18"/><circle cx="120" cy="368" r="18"/>
  </g>
  <!-- dimension line under the plan -->
  <g stroke="#FFCC00" stroke-width="12" stroke-linecap="round">
    <path d="M120 424 H392"/><path d="M120 404 V444"/><path d="M392 404 V444"/>
  </g>
  <!-- count marker -->
  <circle cx="216" cy="250" r="34" fill="#FF3B30" stroke="#fff" stroke-width="10"/>
</svg>
